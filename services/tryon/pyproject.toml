[project]
name = "dressit-tryon"
version = "0.1.0"
description = "DressIt virtual try-on service: FASHN VTON v1.5 (sequential, one garment per pass) without the non-commercial human parser"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "numpy>=1.26",
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    "einops>=0.8",
    "safetensors>=0.4",
    "onnxruntime>=1.20",
    "torch>=2.5",
    "torchvision>=0.20",
    "matplotlib>=3.8",
    "transformers>=5.24",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
# Vendored upstream code (FASHN VTON v1.5, Apache-2.0) is kept as published.
extend-exclude = ["app/fashn"]
