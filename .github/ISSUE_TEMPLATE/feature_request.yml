name: Feature request
description: Suggest something new for DressIt.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, e.g. "packing for a wedding weekend, I want to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Wardrobe
        - Outfits and daily recommendations
        - Planner and trips
        - Shopping and stores
        - Assistant
        - Privacy and security
        - Something else
